openapi: 3.1.0
info:
  title: Conduit Notification Platform API
  description: Multi-tenant notification platform.
  version: 0.1.0
  contact:
    name: Platform Team

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      description: Returns basic application health status.
      operationId: getHealth
      tags: [Health]
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: conduit

  /ready:
    get:
      summary: Readiness check
      description: Checks all dependencies (database, Redis) for readiness.
      operationId: getReady
      tags: [Health]
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more dependencies are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /live:
    get:
      summary: Liveness check
      description: Indicates whether the application is alive.
      operationId: getLive
      tags: [Health]
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive

components:
  schemas:
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          $ref: '#/components/schemas/ComponentStatus'
        redis:
          $ref: '#/components/schemas/ComponentStatus'

    ComponentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [up, down]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
